name: guagua
description: 瓜呱 Flutter 移动端应用
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.2 <4.0.0'
  flutter: '>=3.44.6'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.1

  # 路由
  go_router: ^14.2.0

  # 网络
  dio: ^5.5.0+1
  socket_io_client: ^2.0.3+1

  # 本地存储
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # 图片与媒体
  cached_network_image: ^3.3.1
  photo_view: ^0.15.0
  image_picker: ^1.1.2
  video_player: ^2.9.1
  chewie: ^1.8.1

  # 列表
  flutter_staggered_grid_view: ^0.7.0

  # 工具
  logger: ^2.3.0
  intl: ^0.20.2
  url_launcher: ^6.3.0
  connectivity_plus: ^6.0.3

  # 位置
  geolocator: ^13.0.1
  geocoding: ^5.0.0

  # 本地推送
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # UI
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  http_mock_adapter: ^0.6.1
  custom_lint: ^0.8.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/

  # 字体预留位（确认资源后启用）
  # fonts:
  #   - family: GuaguaIcons
  #     fonts:
  #       - asset: assets/fonts/GuaguaIcons.ttf
