
name: guagua

services:
  # MySQL 数据库服务
  mysql:
    # 使用官方 MySQL 8.0 镜像
    image: mysql:8.0
    container_name: guagua-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: ${DB_NAME:-guagua}
      MYSQL_USER: ${DB_USER:-guagua_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-123456}
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
    networks:
      - guagua-network
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # 后端API服务
  backend:
    build:
      context: ./express-project
      dockerfile: Dockerfile
    container_name: guagua-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: mysql
      DB_USER: ${DB_USER:-guagua_user}
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      DB_NAME: ${DB_NAME:-guagua}
      DB_PORT: 3306
      JWT_SECRET: ${JWT_SECRET:-guagua_secret_key_2025}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-30d}
      API_BASE_URL: http://localhost:3001
      UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE:-50mb}
      IMAGE_UPLOAD_STRATEGY: ${IMAGE_UPLOAD_STRATEGY:-oss}
      VIDEO_UPLOAD_STRATEGY: ${VIDEO_UPLOAD_STRATEGY:-local}
      LOCAL_UPLOAD_DIR: ${LOCAL_UPLOAD_DIR:-uploads}
      LOCAL_BASE_URL: ${LOCAL_BASE_URL:-http://localhost:3001}
      # 阿里云 OSS 配置（当 IMAGE_UPLOAD_STRATEGY=oss 或 VIDEO_UPLOAD_STRATEGY=oss 时使用）
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
      OSS_BUCKET: ${OSS_BUCKET}
      OSS_REGION: ${OSS_REGION:-oss-cn-hangzhou}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-https://oss-cn-hangzhou.aliyuncs.com}
      OSS_CUSTOM_DOMAIN: ${OSS_CUSTOM_DOMAIN}
      # Cloudflare R2 配置（当策略为 r2 时使用）
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_REGION: ${R2_REGION:-auto}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      TZ: Asia/Shanghai
    ports:
      - "3001:3001"
    volumes:
      - backend_uploads:/app/uploads
      - /etc/localtime:/etc/localtime:ro
    command: >
      sh -c "node scripts/init-database.js && npm start"
    networks:
      - guagua-network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 前端Web服务
  frontend:
    build:
      context: ./vue3-project
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:3001/api
    container_name: guagua-frontend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8080:80"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      - guagua-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  guagua-network:
    driver: bridge